name: CI

# Checks every PR and every push to main. Never publishes anything - that is
# release.yml's job. Each part only runs when its folder changed, and
# `ci-ok` at the bottom is the single status check the main ruleset
# requires: it always runs, so a PR that skips a part (an extension-only
# change skipping the server, say) isn't left waiting on a check that never
# reports.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on a PR, but let every run on main finish so each
# commit there keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - "server/**"
              - ".github/workflows/ci.yml"
            extension:
              - "extension/**"
              - ".github/workflows/ci.yml"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json

      # server/.node-version is the one place the Node major is chosen; the
      # Dockerfile's base image has to match it, or CI would be testing a
      # different runtime from the one that ships.
      - name: Dockerfile uses the same Node major as .node-version
        run: |
          want="$(tr -d '[:space:]' < .node-version)"
          bad="$(grep -E '^FROM node:' Dockerfile | grep -v "^FROM node:${want}-" || true)"
          if [ -n "$bad" ]; then
            echo "::error file=server/Dockerfile::Base image must be node:${want}-* to match server/.node-version"
            echo "$bad"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      # Production dependencies only: dev tooling (drizzle-kit, tsx) never
      # ships in the image.
      - run: npm audit --omit=dev --audit-level=high

  # Builds the image exactly like the release does, without pushing it, so a
  # broken Dockerfile shows up on the PR rather than on release day.
  server-image:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.node-version

      - name: JSON files parse
        run: |
          find . -name '*.json' -print0 | xargs -0 -n1 node -e '
            const f = process.argv[1];
            try { JSON.parse(require("fs").readFileSync(f, "utf8")); }
            catch (e) { console.error(`::error file=extension/${f.slice(2)}::${e.message}`); process.exit(1); }
          '

      - name: JavaScript files parse
        run: find . -name '*.js' -print0 | xargs -0 -n1 node --check

      # Every __MSG_key__ the manifest uses must exist in every locale, or
      # the store shows the raw placeholder for that language.
      - name: Manifest messages exist in every locale
        run: |
          node -e '
            const fs = require("fs");
            const keys = [...fs.readFileSync("manifest.json", "utf8").matchAll(/__MSG_(\w+)__/g)].map((m) => m[1]);
            let ok = true;
            for (const locale of fs.readdirSync("_locales")) {
              const messages = JSON.parse(fs.readFileSync(`_locales/${locale}/messages.json`, "utf8"));
              for (const key of keys) {
                if (!messages[key]) { console.error(`::error::_locales/${locale} is missing "${key}"`); ok = false; }
              }
            }
            process.exit(ok ? 0 : 1);
          '

      - name: Package
        run: zip -qr ../browsersync-extension.zip . -x version.txt CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsersync-extension
          path: browsersync-extension.zip
          retention-days: 14

  # The only check the main ruleset requires. Skipped parts are fine (their
  # folder didn't change); a failed or cancelled one fails this.
  ci-ok:
    needs: [changes, server, server-image, extension]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI passed"
