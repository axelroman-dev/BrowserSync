name: Build and publish server image

# Only touches server/ - the extension has no build/publish step of its own.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "server/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {} # lets you trigger a rebuild/republish manually from the Actions tab
  # Called by release-please.yml after a release is created (see there for
  # why the tag push alone doesn't trigger this workflow).
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ""

# Cancels an in-progress run for the same branch/PR when a new commit lands,
# so pushes don't queue up a pile of redundant builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/browsersync-server

jobs:
  # Fast fail-early check, separate from the (slower) multi-arch image build
  # below - a broken build shows up in ~30s instead of after a multi-minute
  # buildx run, and it also runs on PRs from forks that can't see the Docker
  # Hub secrets the publish job needs.
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit

  docker:
    needs: typecheck
    runs-on: ubuntu-latest
    # Least-privilege token: this job only ever reads repo contents. (Nothing
    # here needs `packages: write` - that's only for GitHub Container Registry,
    # not Docker Hub.)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Multi-arch build: your homelab might be a different CPU architecture
      # (e.g. amd64 dev machine, arm64 Raspberry Pi/NAS) than wherever this
      # workflow runs.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Derives every tag/label this image should get from git context:
      #   - the branch name, on a push to main
      #   - "latest", also only on the default branch (never on a PR build)
      #   - semver tags (v1.2.3 -> 1.2.3, 1.2) when you push a version tag,
      #     or when release-please.yml calls this with the released version
      #   - a short commit SHA, always - lets you pin/rollback to an exact build
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.release == true }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.release == true }}
            type=sha,format=short

      # Only log in when we're actually going to push - a pull_request run
      # (including from a fork, which never has access to repo secrets)
      # still builds and validates the image, it just can't publish it.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache for build layers - keeps rebuilds fast even
          # though multi-arch builds can't reuse the local Docker layer cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attaches SBOM + provenance attestations to the published image,
          # so anyone (including future-you) can verify what went into it.
          sbom: true
          provenance: true

  # Keeps the Docker Hub repo's "Overview" tab in sync with server/DOCKERHUB.md,
  # instead of that description drifting out of date after being pasted in
  # once by hand. Only runs after a real publish (not on PRs, which never push).
  dockerhub-description:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # This calls an undocumented Docker Hub API (see the action's own
      # README) and needs a token with "Read, Write, Delete" permissions
      # specifically - "Read & Write" is enough to push images but not to
      # update repo metadata, and Docker Hub returns a bare 403 either way.
      # continue-on-error so a flaky/misscoped token here never fails the
      # whole run - the image itself is already published by this point.
      - uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Self-hosted, end-to-end encrypted bookmark/history sync for Chromium browsers"
          readme-filepath: server/DOCKERHUB.md

  # Reports the run's outcome to Telegram. Skipped on pull_request the same
  # way the docker job's push step is - a fork PR can't see repo secrets
  # anyway, and a same-repo PR build isn't the kind of event worth paging
  # someone about. `if: always()` is what lets this job run even when
  # typecheck/docker failed (the normal "needs" default would just skip it).
  notify-telegram:
    needs: [typecheck, docker, dockerhub-description]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Work out overall pass/fail
        id: result
        run: |
          # Any of the three jobs above being non-'success' - including
          # 'skipped', which here only happens because an earlier one in the
          # chain failed - means the pipeline didn't fully succeed.
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ steps.result.outputs.status }}
          WORKFLOW: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            WORD="succeeded"
          else
            ICON="❌"
            WORD="failed"
          fi
          MESSAGE="${ICON} *${WORKFLOW}* ${WORD} on \`${REF_NAME}\` (${SHA:0:7})
          Triggered by: ${ACTOR}
          ${RUN_URL}"
          curl -sS --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=Markdown"
